<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Stage Editor</title>
<style>
    :root {
        --bg: #131418; --panel: #1b1d22; --panel2: #23262c; --hover: #2b2f36; --border: #2f333a;
        --text: #e4e6eb; --muted: #8b919c; --accent: #5b8cff; --accent-soft: rgba(91, 140, 255, 0.16);
        --ok: #3fb950; --warn: #e3b341; --err: #f85149; --radius: 8px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
        font: 13px/1.5 "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif; }
    button, select, input { font: inherit; color: var(--text); }
    button { cursor: pointer; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
        padding: 4px 10px; transition: background 0.12s, border-color 0.12s; }
    button:hover { background: var(--hover); border-color: #3c414a; }
    button:disabled { opacity: 0.45; cursor: default; }
    button.on { background: var(--accent-soft); border-color: var(--accent); color: #cfdcff; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.primary:hover { background: #6f9aff; }
    button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 2px 6px; }
    button.ghost:hover { background: var(--hover); color: var(--text); }
    button.danger:hover { color: var(--err); }
    select, input { background: #111216; border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; }
    select:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    input[type=number] { width: 72px; }
    input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; vertical-align: middle; }
    input[type=range] { accent-color: var(--accent); padding: 0; border: none; background: none; vertical-align: middle; }

    .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
    aside { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--panel);
        border-right: 1px solid var(--border); padding: 14px 10px; }
    .brand { font-size: 15px; font-weight: 700; padding: 2px 8px 14px; letter-spacing: 0.02em; }
    .brand span { color: var(--accent); }
    .nav { display: flex; flex-direction: column; gap: 2px; margin-bottom: 16px; }
    .nav button { text-align: left; background: transparent; border-color: transparent; padding: 7px 10px; }
    .nav button:hover { background: var(--hover); }
    .nav button.on { background: var(--accent-soft); border-color: transparent; color: #cfdcff; }
    .nav small { display: block; color: var(--muted); font-size: 11px; }
    .side-title { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; padding: 4px 8px; margin-top: 4px; }
    .stage-row { display: flex; align-items: center; gap: 4px; padding: 3px 8px; }
    .stage-row b { width: 64px; font-weight: 500; color: var(--muted); font-size: 12px; }
    .stage-row button { flex: 1; padding: 2px 0; font-size: 11px; }
    .side-list { display: flex; flex-direction: column; gap: 2px; }
    .side-list button { text-align: left; background: transparent; border-color: transparent; }
    .side-list button.on { background: var(--accent-soft); color: #cfdcff; }

    .content { min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px;
        padding: 10px 20px; background: rgba(19, 20, 24, 0.88); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
    .topbar h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; }
    .topbar .spacer { flex: 1; }
    .pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--panel2); color: var(--muted);
        max-width: 560px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pill.ok { color: var(--ok); background: rgba(63, 185, 80, 0.12); }
    .pill.dirty { color: var(--warn); background: rgba(227, 179, 65, 0.12); }
    .pill.error { color: var(--err); background: rgba(248, 81, 73, 0.12); white-space: normal; }
    main { padding: 16px 20px 40px; }

    .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; scroll-margin-top: 64px; }
    .card-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .card-head h2 { font-size: 14px; margin: 0; font-weight: 600; white-space: nowrap; }
    .card-body { padding: 12px 14px; }
    .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; color: var(--muted); }
    .empty { color: var(--muted); padding: 60px 0; text-align: center; }
    .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; min-width: 140px; }
    .stat b { display: block; font-size: 20px; font-weight: 600; }
    .stat span { color: var(--muted); font-size: 12px; }

    table { border-collapse: collapse; width: 100%; margin: 8px 0; }
    th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px; padding: 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 5px 6px; border-bottom: 1px solid #25282e; vertical-align: middle; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }
    tr.selected td { background: var(--accent-soft); }
    tr.link { cursor: pointer; }
    canvas { display: block; background: #0e0f12; border: 1px solid var(--border); border-radius: 6px; touch-action: none; max-width: 100%; height: auto; }
    .help { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
    .canvases { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    .caption { color: var(--muted); font-size: 12px; margin: 0 0 4px; }
    .caption b { color: var(--text); font-weight: 600; }
    .palette { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
    .desc { color: #8fb3ff; font-size: 12px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
    .actions { white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
    <aside>
        <div class="brand">Stage <span>Editor</span></div>
        <div class="nav">
            <button id="tabSheets" class="on">敵の出現<small>いつ・どこに出すか</small></button>
            <button id="tabOverview">ステージ全体<small>全チャプターを俯瞰する</small></button>
            <button id="tabScripts">敵の行動<small>自作の動きと弾</small></button>
        </div>
        <div id="sideDynamic"></div>
    </aside>
    <div class="content">
        <div class="topbar">
            <h1 id="title">Stage Editor</h1>
            <span id="status" class="pill">Presentation/Gameplay/Stages フォルダを開く（Chrome/Edge）</span>
            <span class="spacer"></span>
            <button id="open">フォルダを開く</button>
            <button id="save" disabled>保存</button>
        </div>
        <main id="editor"><div class="empty">右上の「フォルダを開く」で Presentation/Gameplay/Stages を選ぶ</div></main>
    </div>
</div>

<script src="StageSheetGenerator.js"></script>
<script>
"use strict";
const { EnemyTypes, Difficulties, CommandSpecs, GenerateScripts, GenerateSheet, SimulateScript } = window.StageSheetGenerator;

// 敵の種類の表示名（JSONにはStage::EnemyTypeの名前で保存する）
const EnemyLabels = {
    BasicEnemy: "通常機", HeavyEnemy: "重装機", StraightShooterEnemy: "直進狙撃機", ArmoredEnemy: "装甲機",
    CircleShooterEnemy: "円形弾幕砲台", SquareShooterEnemy: "正方形弾幕機", DiveRusherEnemy: "降下突撃機",
    MissileShooterEnemy: "ミサイル機", LinkedLaserEnemy: "連結レーザー機", WallSecurityDroneEnemy: "壁面警備ドローン",
    ScriptedEnemy: "★ 自作の動き"
};
// 種類ごとの表示色
const TypeColors = ["#8cf", "#f96", "#fd6", "#c9f", "#6f9", "#9ff", "#f6c", "#fa6", "#6cf", "#cf6", "#fff"];
const TypeColor = (type) => TypeColors[EnemyTypes.indexOf(type)] || "#fff";

// コマンドの表示名・説明文・初期値
const Commands = {
    MoveTo: { label: "指定地点へ移動", defaults: { frames: 60, x: 1.5, y: 0 },
        describe: (c) => `${c.frames}Fかけて (${c.x}, ${c.y}) へ移動する（プレビューの点をドラッグで変更）` },
    Move: { label: "一定の速度で進む", defaults: { frames: 60, vx: -0.01, vy: 0 },
        describe: (c) => c.frames ? `${c.frames}Fの間、横${c.vx}・縦${c.vy}ずつ進む` :
            `速度を横${c.vx}・縦${c.vy}に変えてすぐ次へ（以降もこの速度で進み続ける）` },
    Wait: { label: "その場で待つ", defaults: { frames: 30 }, describe: (c) => `${c.frames}F止まって待つ` },
    Aim: { label: "自機へ向かって進む", defaults: { frames: 60, speed: 0.015 },
        describe: (c) => `開始時の自機の方向へ、${c.frames}Fの間 速さ${c.speed}で進む` },
    Sine: { label: "波打ちながら進む", defaults: { frames: 120, vx: -0.01, amplitude: 0.3, period: 60 },
        describe: (c) => `${c.frames}Fの間、横${c.vx}ずつ進みながら上下に振れ幅${c.amplitude}・${c.period}Fで1往復` },
    FireAimed: { label: "自機を狙って1発撃つ", defaults: { speed: 0.02 }, describe: (c) => `自機を狙って速さ${c.speed}の弾を1発` },
    FireFan: { label: "自機へ扇状に撃つ", defaults: { count: 3, spread: 30, speed: 0.018 },
        describe: (c) => `自機の方向を中心に${c.spread}°の扇へ${c.count}発（速さ${c.speed}）` },
    FireRing: { label: "全方向へ撃つ", defaults: { count: 8, speed: 0.012, angle: 0 },
        describe: (c) => `${c.count}発を全方向へ（速さ${c.speed}、1発目は${c.angle}°）` },
    Repeat: { label: "前に戻って繰り返す", defaults: { target: 0, count: 1 },
        describe: (c) => `#${c.target}へ戻ってやり直す（${c.count ? `あと${c.count}回` : "無限に"}）` }
};
// コマンド引数の表示名
const ArgLabels = { frames: "時間F", vx: "横速度", vy: "縦速度", x: "目標X", y: "目標Y", speed: "速さ",
    amplitude: "振れ幅", period: "周期F", count: "弾数", angle: "1発目の角度°", spread: "扇の広さ°", target: "戻り先#" };
// 整数で入力するコマンド引数
const IntegerArgs = ["frames", "count", "target"];
// 出現位置図の範囲（3Dを正面から見た横X・高さY、2DではYだけ使う）
const PlaceView = { minX: -1.3, maxX: 1.3, minY: -1.7, maxY: 1.6, scale: 90 };
// 行動プレビューの範囲（ゲームの2D座標、敵の消滅位置と出現位置を含む）
const View = { minX: -2.6, maxX: 3.0, minY: -1.7, maxY: 1.6, scale: 110 };
// 行動プレビューの再生状態（保存しない）
const preview = { frame: 0, playing: false, speed: 1, mode: "2d", startY: 0, playerX: -0.72, playerY: 0, draw: null };

let stagesDir = null;
let scriptsEntry = null;   // { name, dir, data, saved }
let sheets = [];           // { name, dir, data, saved }
let tab = "sheets";
let current = null;
let scriptIndex = 0;
let selectedRule = null;   // { chapter, rule }
let selectedCommand = -1;
let showDetail = false;

const $ = (id) => document.getElementById(id);
const IsDirty = (entry) => JSON.stringify(entry.data) !== entry.saved;
const ScriptNames = () => scriptsEntry.data.scripts.map((script) => script.name);
const Round = (v) => Math.round(v * 100) / 100;

/**
 * @brief ステータス表示を更新する
 * @param text 表示する文字列
 * @param cls 表示スタイルのクラス名
 * @return なし
 */
function SetStatus(text, cls) {
    $("status").textContent = text;
    $("status").className = "pill " + (cls || "");
    $("status").title = text;
}

/**
 * @brief 要素を生成する
 * @param tag タグ名
 * @param props 設定するプロパティ
 * @param children 子要素または文字列
 * @return 生成した要素
 */
function El(tag, props, ...children) {
    const e = Object.assign(document.createElement(tag), props || {});
    e.append(...children);
    return e;
}

/**
 * @brief 編集内容を反映して再描画する
 * @return なし
 */
function Changed() {
    Render();
}

/**
 * @brief 数値入力欄を生成する
 * @param obj 値を持つオブジェクト
 * @param key 編集するキー
 * @param step 入力の刻み幅（1なら整数）
 * @param title マウスを重ねた時の説明
 * @return 入力欄要素
 */
function NumberInput(obj, key, step, title) {
    return El("input", {
        type: "number", step, value: obj[key], title: title || "",
        onchange: (e) => {
            const v = Number(e.target.value);
            obj[key] = step === 1 ? Math.round(v) : v;
            Changed();
        }
    });
}

/**
 * @brief canvas上の点をドラッグできるようにする
 * @param canvas 対象のcanvas
 * @param handles ドラッグできる点 { x, y, move(px, py), select() } の一覧を返す関数（座標はピクセル）
 * @param redraw ドラッグ中に呼ぶ再描画関数
 * @return なし
 */
function MakeDraggable(canvas, handles, redraw) {
    let active = null;
    let moved = false;
    const pos = (e) => {
        const r = canvas.getBoundingClientRect();
        return [(e.clientX - r.left) * canvas.width / r.width, (e.clientY - r.top) * canvas.height / r.height];
    };
    // 押した位置に最も近い点をつかむ
    canvas.onpointerdown = (e) => {
        const [px, py] = pos(e);
        let best = 12 * 12;
        for (const h of handles()) {
            const d = (h.x - px) ** 2 + (h.y - py) ** 2;
            if (d <= best) { best = d; active = h; }
        }
        if (!active) return;
        moved = false;
        canvas.setPointerCapture(e.pointerId);
    };
    // つかんだ点を動かし、離した時に編集内容として確定する
    canvas.onpointermove = (e) => {
        const [px, py] = pos(e);
        canvas.style.cursor = active || handles().some((h) => (h.x - px) ** 2 + (h.y - py) ** 2 <= 144) ? "grab" : "default";
        if (!active || !active.move) return;
        moved = true;
        active.move(px, py);
        redraw();
    };
    canvas.onpointerup = () => {
        if (!active) return;
        const h = active;
        active = null;
        if (moved || !h.select) Changed();
        else h.select();
    };
}

/**
 * @brief 名前の右に説明を添えた見出しを作る
 * @param title 見出し
 * @param help 説明
 * @return 要素
 */
function Caption(title, help) {
    return El("div", { className: "caption" }, El("b", {}, title), "  ", help);
}

/**
 * @brief チャプターの出現位置図を作る（3Dを正面から見た横Xと高さY）
 * @param chapter 対象のチャプター
 * @param ci チャプター番号
 * @return 要素
 */
function PlacementView(chapter, ci) {
    const v = PlaceView;
    const canvas = El("canvas", { width: (v.maxX - v.minX) * v.scale, height: (v.maxY - v.minY) * v.scale });
    const g = canvas.getContext("2d");
    const sx = (x) => (x - v.minX) * v.scale, sy = (y) => (v.maxY - y) * v.scale;
    const fx = (px) => px / v.scale + v.minX, fy = (py) => v.maxY - py / v.scale;
    const draw = () => {
        g.clearRect(0, 0, canvas.width, canvas.height);
        // 乱数配置の範囲と中心線を描く
        g.strokeStyle = "#444"; g.setLineDash([4, 4]);
        g.strokeRect(sx(-1), sy(0.86), 2 * v.scale, 1.72 * v.scale);
        g.setLineDash([]);
        g.fillStyle = "#333"; g.fillRect(0, sy(0), canvas.width, 1); g.fillRect(sx(0), 0, 1, canvas.height);
        // 規則ごとの出現位置を番号付きで描く
        chapter.rules.forEach((r, ri) => {
            const selected = selectedRule && selectedRule.chapter === ci && selectedRule.rule === ri;
            g.fillStyle = g.strokeStyle = TypeColor(r.type);
            g.beginPath(); g.arc(sx(r.railX), sy(r.y), selected ? 10 : 7, 0, Math.PI * 2);
            if (r.randomPosition) g.stroke(); else g.fill();
            g.fillStyle = r.randomPosition ? TypeColor(r.type) : "#000";
            g.font = "bold 10px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
            g.fillText(r.randomPosition ? "?" : String(ri + 1), sx(r.railX), sy(r.y) + 0.5);
        });
    };
    MakeDraggable(canvas, () => chapter.rules.map((r, ri) => ({
        x: sx(r.railX), y: sy(r.y),
        move: (px, py) => { r.railX = Round(fx(px)); r.y = Round(fy(py)); selectedRule = { chapter: ci, rule: ri }; },
        select: () => { selectedRule = { chapter: ci, rule: ri }; Render(); }
    })), draw);
    draw();
    return El("div", {}, Caption("出現位置", "●をドラッグ"), canvas,
        El("div", { className: "help" }, "横 = 3Dの左右、縦 = 高さ（2D/3D共通）", El("br"), "点線内 = 位置ランダム時の範囲、○? = ランダム"));
}

/**
 * @brief チャプターの出現タイミング図を作る
 * @param chapter 対象のチャプター
 * @param ci チャプター番号
 * @param length チャプターのフレーム数
 * @return 要素
 */
function TimelineView(chapter, ci, length) {
    const rowH = 18, left = 26, width = 640, top = 4;
    const canvas = El("canvas", { width: width + left + 10, height: Math.max(1, chapter.rules.length) * rowH + top + 18 });
    const g = canvas.getContext("2d");
    const fx = (f) => left + f / length * width;
    const draw = () => {
        g.clearRect(0, 0, canvas.width, canvas.height);
        // 100フレームごとの目盛りを描く
        g.font = "10px sans-serif"; g.textBaseline = "alphabetic";
        for (let f = 0; f <= length; f += 100) {
            g.fillStyle = f % 500 === 0 ? "#555" : "#333";
            g.fillRect(fx(f), 0, 1, canvas.height - 14);
            if (f % 500 === 0) { g.fillStyle = "#888"; g.textAlign = "left"; g.fillText(`${f}F`, fx(f) + 2, canvas.height - 3); }
        }
        // 規則ごとに最初の出現（大）と繰り返しの出現（小）を描く
        chapter.rules.forEach((r, ri) => {
            const y = top + ri * rowH;
            const selected = selectedRule && selectedRule.chapter === ci && selectedRule.rule === ri;
            if (selected) { g.fillStyle = "#2d3a4f"; g.fillRect(0, y, canvas.width, rowH); }
            g.fillStyle = "#aaa"; g.textAlign = "right"; g.fillText(String(ri + 1), left - 6, y + 13);
            g.fillStyle = TypeColor(r.type);
            for (let f = r.firstFrame + r.interval; r.interval > 0 && f < length; f += r.interval) g.fillRect(fx(f) - 1, y + 5, 3, rowH - 10);
            g.beginPath(); g.arc(fx(r.firstFrame), y + rowH / 2, selected ? 7 : 6, 0, Math.PI * 2); g.fill();
        });
    };
    MakeDraggable(canvas, () => chapter.rules.map((r, ri) => ({
        x: fx(r.firstFrame), y: top + ri * rowH + rowH / 2,
        move: (px) => {
            r.firstFrame = Math.max(0, Math.min(length - 1, Math.round((px - left) / width * length / 5) * 5));
            selectedRule = { chapter: ci, rule: ri };
        },
        select: () => { selectedRule = { chapter: ci, rule: ri }; Render(); }
    })), draw);
    draw();
    return El("div", {}, Caption("出現タイミング", "●をドラッグで最初に出るフレーム（5F単位）、細い線は「間隔」ごとの再出現"), canvas);
}

/**
 * @brief 出現シートの編集画面を描画する
 * @param root 描画先の要素
 * @return なし
 */
function RenderSheet(root) {
    if (!current) return;
    const sheet = current.data;

    root.append(El("div", { className: "toolbar" }, "1チャプターの長さ", NumberInput(sheet, "chapterLength", 1), "F",
        El("label", {}, El("input", { type: "checkbox", checked: showDetail, onchange: (e) => { showDetail = e.target.checked; Render(); } }),
            " 詳細な値も表示（2DのX・3Dの奥行き）")));

    sheet.chapters.forEach((chapter, ci) => {
        // 規則の表を作る
        const detail = showDetail ? [["sideX", "2DのX", 0.01, "2Dの出現X。2.8未満は2.8になる"], ["railZ", "3Dの奥行き", 1, "3Dの出現奥行き。60未満は60になる"]] : [];
        const table = El("table");
        table.append(El("tr", {}, El("th", {}, "#"), El("th", {}, "敵の種類"), El("th", {}, "最初に出る"), El("th", {}, "繰り返す間隔"),
            El("th", {}, "高さY"), El("th", {}, "3Dの左右X"), ...detail.map(([, label]) => El("th", {}, label)),
            El("th", {}, "位置ランダム"), El("th")));
        chapter.rules.forEach((rule, ri) => {
            const typeSelect = El("select", { onchange: (e) => { rule.type = e.target.value; Changed(); } },
                ...EnemyTypes.map((t) => El("option", { value: t, selected: t === rule.type }, EnemyLabels[t] || t)));
            // 自作の動きの敵は使う行動を選び、行動タブへ移れるようにする
            const scriptPart = rule.type !== "ScriptedEnemy" ? [] : [
                El("select", { onchange: (e) => { rule.script = e.target.value; Changed(); } },
                    El("option", { value: "" }, "(動きを選ぶ)"),
                    ...ScriptNames().map((n) => El("option", { value: n, selected: n === rule.script }, n))),
                El("button", { title: "この動きを編集する", onclick: () => {
                    const i = ScriptNames().indexOf(rule.script);
                    if (i >= 0) scriptIndex = i;
                    SwitchTab("scripts");
                } }, "動きを見る")];
            const move = (d) => {
                const j = ri + d;
                if (j < 0 || j >= chapter.rules.length) return;
                [chapter.rules[ri], chapter.rules[j]] = [chapter.rules[j], chapter.rules[ri]];
                selectedRule = { chapter: ci, rule: j };
                Changed();
            };
            const selected = selectedRule && selectedRule.chapter === ci && selectedRule.rule === ri;
            table.append(El("tr", { className: selected ? "selected" : "", onclick: (e) => {
                if (selected || e.target.tagName !== "TD") return;
                selectedRule = { chapter: ci, rule: ri };
                Render();
            } },
                El("td", { style: `color: ${TypeColor(rule.type)}` }, `● ${ri + 1}`), El("td", {}, typeSelect, ...scriptPart),
                El("td", {}, NumberInput(rule, "firstFrame", 1, "チャプター開始から何フレーム後に最初に出すか"), " F"),
                El("td", {}, NumberInput(rule, "interval", 1, "0なら1回だけ出す"), rule.interval > 0 ? " Fごと" : " (1回だけ)"),
                El("td", {}, NumberInput(rule, "y", 0.01, "上が+、下が-")),
                El("td", {}, NumberInput(rule, "railX", 0.01, "3Dで右が+、左が-")),
                ...detail.map(([key, , step, title]) => El("td", {}, NumberInput(rule, key, step, title))),
                El("td", {}, El("input", { type: "checkbox", checked: !!rule.randomPosition, title: "出るたびに高さと3Dの左右をランダムにする",
                    onchange: (e) => { rule.randomPosition = e.target.checked; Changed(); } })),
                El("td", { className: "actions" },
                    El("button", { className: "ghost", title: "上へ", onclick: () => move(-1) }, "↑"),
                    El("button", { className: "ghost", title: "下へ", onclick: () => move(1) }, "↓"),
                    El("button", { className: "ghost", onclick: () => { chapter.rules.splice(ri + 1, 0, { ...rule }); Changed(); } }, "複製"),
                    El("button", { className: "ghost danger", onclick: () => { chapter.rules.splice(ri, 1); selectedRule = null; Changed(); } }, "削除"))));
        });

        // チャプター単位の操作を作る
        const newRule = { type: "BasicEnemy", firstFrame: 25, interval: 100, sideX: 2.6, railX: 0, y: 0, railZ: 60, randomPosition: false };
        root.append(El("section", { className: "card", id: `chapter-${ci}` },
            El("div", { className: "card-head" }, El("h2", {}, `チャプター ${ci + 1}`),
                El("input", { value: chapter.comment || "", placeholder: "メモ（例: 通常機と狙撃機）", style: "flex: 1",
                    onchange: (e) => { chapter.comment = e.target.value; Changed(); } }),
                El("button", { className: "ghost danger", onclick: () => {
                    if (sheet.chapters.length > 1 && confirm(`チャプター${ci + 1}を削除する?`)) { sheet.chapters.splice(ci, 1); selectedRule = null; Changed(); }
                } }, "チャプターを削除")),
            El("div", { className: "card-body" },
                El("div", { className: "canvases" }, PlacementView(chapter, ci), TimelineView(chapter, ci, sheet.chapterLength)),
                table,
                El("button", { onclick: () => { chapter.rules.push({ ...newRule }); selectedRule = { chapter: ci, rule: chapter.rules.length - 1 }; Changed(); } }, "＋ 敵を追加"))));
    });
    root.append(El("button", { onclick: () => { sheet.chapters.push({ comment: "", rules: [] }); Changed(); } }, "＋ チャプターを追加"));
}

/**

 * @param sheet 対象のシート
 * @return { frame, chapter, rule, key } の配列（frameはステージ開始からのフレーム、keyは表示上の敵の種類）
 */
function ListSpawns(sheet) {
    const spawns = [];
    const length = sheet.chapterLength;
    sheet.chapters.forEach((chapter, ci) => chapter.rules.forEach((rule) => {
        const key = rule.type === "ScriptedEnemy" ? `★ ${rule.script || "(未選択)"}` : EnemyLabels[rule.type] || rule.type;
        // ゲームと同じく、最初のフレームと間隔ごとにチャプターの終わりまで出す
        for (let f = rule.firstFrame; f < length; f += rule.interval > 0 ? rule.interval : length) {
            spawns.push({ frame: ci * length + f, chapter: ci, rule, key });
        }
    }));
    return spawns;
}

/**
 * @brief 既存の敵が2Dで出現してからageフレーム後にいる位置を求める
 *
 * ponytail: C++の各敵の主な動きだけを写した近似。弾・撃破・画面内の数の上限・自機の移動は再現しない
 * 動きを変えた場合は SideScrollingShooterEnemies.h の各Tickと合わせる
 * @param type 敵の種類（Stage::EnemyTypeの名前）
 * @param age 出現してからのフレーム数
 * @param y0 出現時の高さ
 * @param phase 上下の揺れの位相
 * @return { x, y }
 */
function BuiltinPosition(type, age, y0, phase) {
    const x0 = 2.8;
    const wave = (speed, rate, amplitude) => ({ x: x0 - speed * age, y: y0 + Math.sin(phase + age * rate) * amplitude });
    switch (type) {
    case "BasicEnemy": return wave(0.010, 0.055, 0.10);
    case "HeavyEnemy": return wave(0.007, 0.055, 0.18);
    case "ArmoredEnemy": return wave(0.006, 0.050, 0.16);
    case "StraightShooterEnemy": return wave(0.020, 0, 0);
    case "LinkedLaserEnemy": return wave(0.012, 0, 0);
    case "CircleShooterEnemy":
    case "SquareShooterEnemy":
        // X=0.75で止まって撃ち、288F後に左へ離脱する
        return { x: age < 288 ? Math.max(x0 - 0.012 * age, 0.75) : 0.75 - 0.012 * (age - 288), y: y0 };
    case "MissileShooterEnemy":
        // 下側のX=1.75で止まり、撃破されるまで撃ち続ける
        return { x: Math.max(x0 - 0.012 * age, 1.75), y: -0.92 };
    case "DiveRusherEnemy": {
        // 高所を進んで自機の手前で24F止まり、42Fの曲線で自機へ降下してから突撃する
        const playerX = -0.72, playerY = 0, highY = 0.96;
        const stopAge = Math.ceil((x0 - (playerX + 1.52)) / 0.020);
        if (age <= stopAge) return { x: x0 - 0.020 * age, y: highY };
        const stopX = x0 - 0.020 * stopAge;
        const t = age - stopAge - 24;
        if (t <= 0) return { x: stopX, y: highY };
        if (t < 42) {
            const p = t / 42 * Math.PI / 2;
            return { x: stopX + (playerX - stopX) * (1 - Math.cos(p)), y: highY + (playerY - highY) * Math.sin(p) };
        }
        return { x: playerX - 0.034 * (t - 42), y: playerY };
    }
    default: return wave(0.010, 0, 0);
    }
}

// 3Dの座標の対応（SideScrollingShooter.h の WorldXScale・WorldYScale・PlayerRailZ と ScriptedEnemyBehavior に合わせる）
const Rail = { playerZ: 8, worldX: 7, worldY: 4.4, depthPerScriptX: (60 - 2) / (2.8 + 2.6) };
const RailZFromScriptX = (x) => 2 + (x + 2.6) * Rail.depthPerScriptX;
const ScriptXFromRailZ = (z) => (z - 2) / Rail.depthPerScriptX - 2.6;

/**
 * @brief 自作の動きを3Dで実行した結果を求める（ScriptedEnemyBehaviorの3D変換と同じ）
 * @param script 行動スクリプト
 * @param railX 3Dの左右位置
 * @param y0 出現時の高さ
 * @param playerX 自機の左右位置
 * @param playerY 自機の高さ
 * @return { path: {x, y, z, pc}[], shots: {frame, pc, x, y, z, vx, vy, vz}[] }
 */
function SimulateScript3D(script, railX, y0, playerX, playerY) {
    // 2Dの横位置を奥行きへ読み替え、自機の奥行きを2Dの横位置にして狙う
    const r = SimulateScript(script, 2.8, y0, ScriptXFromRailZ(Rail.playerZ), playerY, 3600);
    return {
        path: r.path.map((p) => ({ x: railX, y: p.y, z: RailZFromScriptX(p.x), pc: p.pc })),
        shots: r.shots.map((s) => {
            // 弾幕の面を自機の左右位置へ傾ける
            const z = RailZFromScriptX(s.x), vz = s.vx * Rail.depthPerScriptX, depth = Rail.playerZ - z;
            return { frame: s.frame, pc: s.pc, x: railX, y: s.y, z,
                vx: Math.abs(depth) > 0.001 ? vz * (playerX - railX) / depth : 0, vy: s.vy, vz };
        })
    };
}

/**
 * @brief 既存の敵が3Dで出現してからageフレーム後にいる位置を求める
 *
 * ponytail: BuiltinPositionと同じく各敵の3D側Tickの主な動きだけを写した近似
 * @param type 敵の種類
 * @param age 出現してからのフレーム数
 * @param x0 出現時の左右位置
 * @param y0 出現時の高さ
 * @param phase 揺れの位相
 * @return { x, y, z }（x, yはゲーム座標、zは奥行き）
 */
function BuiltinPosition3D(type, age, x0, y0, phase) {
    const z0 = 60;
    const wave = (speed, xRate, xAmp, yRate, yAmp) => ({ x: x0 + Math.sin(phase + age * xRate) * xAmp,
        y: y0 + Math.sin(phase + age * yRate) * yAmp, z: z0 - speed * age });
    switch (type) {
    case "BasicEnemy": return wave(0.42, 0.045, 0.16, 0.055, 0.10);
    case "HeavyEnemy": return wave(0.30, 0.045, 0.24, 0.055, 0.18);
    case "ArmoredEnemy": return wave(0.25, 0.038, 0.30, 0.050, 0.16);
    case "StraightShooterEnemy": return wave(0.36, 0, 0, 0, 0);
    case "LinkedLaserEnemy": return wave(0.24, 0, 0, 0, 0);
    case "CircleShooterEnemy":
    case "SquareShooterEnemy":
        // 自機の24先で止まって撃ち続ける
        return { x: x0, y: y0, z: Math.max(z0 - 0.30 * age, Rail.playerZ + 24) };
    case "MissileShooterEnemy": return { x: x0, y: -0.92, z: Math.max(z0 - 0.30 * age, Rail.playerZ + 24) };
    case "DiveRusherEnemy": {
        // 自機の25先で24F止まり、42Fの曲線で自機へ降下してから突撃する
        const highY = 0.96, stopZ = Rail.playerZ + 25;
        const stopAge = Math.ceil((z0 - stopZ) / 0.36);
        if (age <= stopAge) return { x: x0, y: highY, z: z0 - 0.36 * age };
        const z1 = z0 - 0.36 * stopAge;
        const t = age - stopAge - 24;
        if (t <= 0) return { x: x0, y: highY, z: z1 };
        if (t < 42) {
            const p = t / 42 * Math.PI / 2, h = 1 - Math.cos(p);
            return { x: x0 + (0 - x0) * h, y: highY + (0 - highY) * Math.sin(p), z: z1 + (Rail.playerZ - z1) * h };
        }
        return { x: 0, y: 0, z: Rail.playerZ - 0.72 * (t - 42) };
    }
    default: return wave(0.42, 0, 0, 0, 0);
    }
}

/**
 * @brief 自機の後ろ上方から見た3D画面を描く（ゲームのレール視点のカメラに合わせる）
 * @param g 描画先
 * @param w 幅
 * @param h 高さ
 * @param scene { enemies: {x, y, z, color, ring}[], shots: {x, y, z, color}[], trail: {x, y, z, hl}[], playerX, playerY }
 * @return なし
 */
function Draw3D(g, w, h, scene) {
    // カメラは自機から(0, 2.8, -7.5)の位置で、自機の14先を見る
    const player = { x: (scene.playerX || 0) * Rail.worldX, y: (scene.playerY || 0) * Rail.worldY, z: Rail.playerZ };
    const eye = { x: player.x, y: player.y + 2.8, z: player.z - 7.5 };
    const look = { x: 0, y: 0.5 - 2.8, z: 14 + 7.5 };
    const len = Math.hypot(look.y, look.z);
    const fwd = { y: look.y / len, z: look.z / len }, up = { y: fwd.z, z: -fwd.y };
    const focal = (h / 2) / Math.tan(Math.PI / 6);
    const project = (x, y, z) => {
        const rx = x - eye.x, ry = y - eye.y, rz = z - eye.z;
        const depth = ry * fwd.y + rz * fwd.z;
        if (depth < 0.5) return null;
        return { x: w / 2 + rx * focal / depth, y: h / 2 - (ry * up.y + rz * up.z) * focal / depth, s: focal / depth };
    };
    const at = (p) => project(p.x * Rail.worldX, p.y * Rail.worldY, p.z);
    g.clearRect(0, 0, w, h);

    // 奥行きがわかるように床の格子を描く
    const floorY = -1.7 * Rail.worldY;
    g.strokeStyle = "#1f2329"; g.lineWidth = 1;
    for (let x = -21; x <= 21; x += 3.5) {
        const a = project(x, floorY, 2), b = project(x, floorY, 64);
        if (a && b) { g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); }
    }
    g.fillStyle = "#4a505a"; g.font = "10px sans-serif"; g.textAlign = "left"; g.textBaseline = "middle";
    for (let z = 10; z <= 60; z += 10) {
        const a = project(-21, floorY, z), b = project(21, floorY, z);
        if (!a || !b) continue;
        g.strokeStyle = z === 60 ? "#3a3f48" : "#1f2329";
        g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
        if (z === 60) g.fillText("出現", b.x + 4, b.y);
    }

    // 軌跡を描く
    (scene.trail || []).forEach((p, i, list) => {
        if (i === 0) return;
        const a = at(list[i - 1]), b = at(p);
        if (!a || !b) return;
        g.strokeStyle = p.hl ? "#fc6" : "#555"; g.lineWidth = p.hl ? 3 : 1;
        g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    });
    g.lineWidth = 1;

    // 奥の物から順に敵・弾・自機を描く
    const items = [
        ...(scene.enemies || []).map((e) => ({ ...e, r: 0.7 })),
        ...(scene.shots || []).map((s) => ({ ...s, r: 0.22 })),
        { x: scene.playerX || 0, y: scene.playerY || 0, z: Rail.playerZ, player: true }
    ].sort((a, b) => b.z - a.z);
    for (const item of items) {
        const p = at(item);
        if (!p) continue;
        if (item.player) {
            g.fillStyle = "#6cf";
            g.beginPath(); g.moveTo(p.x, p.y - 0.35 * p.s); g.lineTo(p.x - 0.6 * p.s, p.y + 0.3 * p.s); g.lineTo(p.x + 0.6 * p.s, p.y + 0.3 * p.s); g.fill();
            continue;
        }
        g.fillStyle = item.color;
        g.beginPath(); g.arc(p.x, p.y, Math.max(1.5, item.r * p.s), 0, Math.PI * 2); g.fill();
        if (item.ring) { g.strokeStyle = "#fd6"; g.lineWidth = 2; g.stroke(); g.lineWidth = 1; }
    }
}

/**
 * @brief ステージの敵の出現と動きを動画のように再生する画面を作る
 * @param sheet 対象のシート
 * @param spawns ListSpawnsの結果
 * @param total ステージ全体のフレーム数
 * @return { element, draw }
 */
function StagePlayer(sheet, spawns, total) {
    const width = (View.maxX - View.minX) * View.scale, height = (View.maxY - View.minY) * View.scale;
    const canvas = El("canvas", { width, height, style: "width: 100%; max-width: 900px" });
    const g = canvas.getContext("2d");
    const sx = (x) => (x - View.minX) * View.scale, sy = (y) => (View.maxY - y) * View.scale;
    const slider = El("input", { type: "range", min: 0, max: total, value: preview.frame, style: "flex: 1",
        oninput: (e) => { preview.frame = Number(e.target.value); preview.draw(); } });
    const label = El("span", { style: "min-width: 230px; color: var(--muted)" });
    const playButton = El("button", { className: "primary", style: "min-width: 84px", onclick: () => {
        if (preview.frame >= total) preview.frame = 0;
        preview.playing = !preview.playing;
        playButton.textContent = preview.playing ? "■ 停止" : "▶ 再生";
    } }, preview.playing ? "■ 停止" : "▶ 再生");
    const speedSelect = El("select", { onchange: (e) => { preview.speed = Number(e.target.value); } },
        ...[1, 2, 4, 8].map((v) => El("option", { value: v, selected: v === preview.speed }, `×${v}`)));

    // 出現ごとの初期値を決め、自作の動きは実行結果をまとめて求めておく
    const scripts = new Map(scriptsEntry.data.scripts.map((s) => [s.name, s]));
    const random = (n) => ((Math.sin(n * 12.9898) * 43758.5453) % 1 + 1) % 1;
    const actors = spawns.map((s, i) => {
        // ponytail: 位置ランダムはゲームの乱数と別の固定乱数で決める。ゲームとは高さが一致しない
        const y0 = s.rule.randomPosition ? -0.86 + 1.72 * random(i + 1) : s.rule.y;
        const x0 = s.rule.randomPosition ? -1 + 2 * random(i + 101) : s.rule.railX;
        const phase = ((s.frame + (sheet.stage - 1) * 17) % 47) * 0.17;
        const script = s.rule.type === "ScriptedEnemy" ? scripts.get(s.rule.script) : null;
        let result = null;
        if (script) {
            try {
                result = preview.mode === "3d" ? SimulateScript3D(script, x0, y0, 0, 0) : SimulateScript(script, 2.8, y0, -0.72, 0, 3600);
            } catch (e) { result = null; }
        }
        return { spawn: s, x0, y0, phase, result };
    });

    // 3Dでは画面内の敵と弾を集めて自機の後ろから見た図を描く
    const draw3D = (t) => {
        const enemies = [], shots = [];
        for (const a of actors) {
            const age = t - a.spawn.frame;
            if (age < 0) continue;
            let pos;
            if (a.spawn.rule.type === "ScriptedEnemy") {
                if (!a.result || age > a.result.path.length) continue;
                pos = age === 0 ? { x: a.x0, y: a.y0, z: 60 } : a.result.path[age - 1];
                for (const s of a.result.shots) {
                    if (s.frame >= age) continue;
                    const dt = age - s.frame;
                    const z = s.z + s.vz * dt;
                    if (z < 0 || z > 70) continue;
                    shots.push({ x: s.x + s.vx * dt, y: s.y + s.vy * dt, z, color: "#fd6" });
                }
            } else {
                pos = BuiltinPosition3D(a.spawn.rule.type, age, a.x0, a.y0, a.phase);
            }
            if (pos.z < 2) continue;
            enemies.push({ ...pos, color: TypeColor(a.spawn.rule.type), ring: a.spawn.rule.type === "ScriptedEnemy" });
        }
        Draw3D(g, width, height, { enemies, shots });
        return [enemies.length, shots.length];
    };

    const draw = () => {
        const t = Math.round(preview.frame);
        if (preview.mode === "3d") {
            const [alive, bullets] = draw3D(t);
            drawLabels(t, alive, bullets);
            return;
        }
        g.clearRect(0, 0, width, height);
        // 自機の移動範囲と自機の基準位置を描く
        g.strokeStyle = "#2a2e35";
        g.strokeRect(sx(-2.0), sy(1.53), 4.0 * View.scale, 3.15 * View.scale);
        g.fillStyle = "#6cf";
        g.beginPath(); g.moveTo(sx(-0.72) + 10, sy(0)); g.lineTo(sx(-0.72) - 8, sy(0) - 7); g.lineTo(sx(-0.72) - 8, sy(0) + 7); g.fill();
        // 出現済みで画面内にいる敵と、自作の動きの敵の弾を描く
        let alive = 0, bullets = 0;
        for (const a of actors) {
            const age = t - a.spawn.frame;
            if (age < 0) continue;
            let pos;
            if (a.spawn.rule.type === "ScriptedEnemy") {
                if (!a.result || age > a.result.path.length) continue;
                pos = age === 0 ? { x: 2.8, y: a.y0 } : a.result.path[age - 1];
                g.fillStyle = "#fd6";
                for (const s of a.result.shots) {
                    if (s.frame >= age) continue;
                    const x = s.x + s.vx * (age - s.frame), y = s.y + s.vy * (age - s.frame);
                    if (x < View.minX || x > View.maxX || y < View.minY || y > View.maxY) continue;
                    g.fillRect(sx(x) - 2, sy(y) - 2, 4, 4);
                    ++bullets;
                }
            } else {
                pos = BuiltinPosition(a.spawn.rule.type, age, a.y0, a.phase);
            }
            if (pos.x < -2.6) continue;
            ++alive;
            g.fillStyle = TypeColor(a.spawn.rule.type);
            g.beginPath(); g.arc(sx(pos.x), sy(pos.y), 7, 0, Math.PI * 2); g.fill();
            if (a.spawn.rule.type === "ScriptedEnemy") { g.strokeStyle = "#fd6"; g.lineWidth = 2; g.stroke(); g.lineWidth = 1; }
        }
        drawLabels(t, alive, bullets);
    };

    // 現在の時刻と画面内の数を表示する
    const drawLabels = (t, alive, bullets) => {
        const ci = Math.min(sheet.chapters.length - 1, Math.floor(t / sheet.chapterLength));
        g.fillStyle = "#e4e6eb"; g.font = "600 13px sans-serif"; g.textAlign = "left"; g.textBaseline = "top";
        g.fillText(`チャプター${ci + 1}`, 10, 8);
        g.fillStyle = "#8b919c"; g.font = "12px sans-serif";
        g.fillText(sheet.chapters[ci].comment || "", 10, 28);
        slider.value = t;
        label.textContent = `${t} / ${total}F　画面内の敵 ${alive}体` + (bullets ? `・弾 ${bullets}発` : "");
        playButton.textContent = preview.playing ? "■ 停止" : "▶ 再生";
    };

    const legend = [...new Set(spawns.map((s) => s.rule.type))].map((type) =>
        El("span", {}, El("span", { className: "dot", style: `background: ${TypeColor(type)}` }), EnemyLabels[type] || type));
    const element = El("section", { className: "card" },
        El("div", { className: "card-head" }, El("h2", {}, "再生"), ModeSwitch(),
            El("span", { className: "help", style: "margin: 0" }, "ステージの最初から敵の出現と動きを再生する")),
        El("div", { className: "card-body" },
            El("div", { className: "toolbar" }, playButton, "速さ", speedSelect, slider, label),
            canvas,
            El("div", { className: "toolbar", style: "margin: 8px 0 0" }, ...legend),
            El("div", { className: "help" }, "自作の動き（黄色の縁）はゲームと同じ計算で弾も表示する。既存の敵は主な動きの近似で弾は表示しない。3Dでは奥の「出現」の線から手前へ来る。",
                "自機は動かないものとし、撃破や画面内の数の上限は再現しない")));
    return { element, draw };
}

/**
 * @brief ステージ全体を1本の時間軸で俯瞰する画面を描画する
 * @param root 描画先の要素
 * @return なし
 */
function RenderOverview(root) {
    if (!current) return;
    const sheet = current.data;
    const length = sheet.chapterLength;
    const total = length * sheet.chapters.length;
    const spawns = ListSpawns(sheet);
    const keys = [...new Set(spawns.map((s) => s.key))];
    const colorOf = (key) => TypeColor(spawns.find((s) => s.key === key).rule.type);

    // 数値のまとめを表示する
    const bucket = 60;
    const counts = new Array(Math.ceil(total / bucket)).fill(0);
    for (const s of spawns) ++counts[Math.floor(s.frame / bucket)];
    const peak = Math.max(1, ...counts);
    root.append(El("div", { className: "stats" },
        ...[[`${total}F`, "ステージの長さ（ボス前まで）"], [String(sheet.chapters.length), "チャプター数"],
            [String(spawns.length), "出現する敵の数"], [`${peak}体`, `一番混む${bucket}F間`]]
            .map(([value, label]) => El("div", { className: "stat" }, El("b", {}, value), El("span", {}, label)))));

    // 混み具合のグラフ、チャプターの帯、種類ごとの出現を1枚に描く
    const left = 132, width = 1000, graphH = 70, laneH = 22, top = 22;
    const canvas = El("canvas", { width: left + width + 16, height: top + graphH + 10 + keys.length * laneH + 24 });
    const g = canvas.getContext("2d");
    const fx = (f) => left + f / total * width;
    let hover = -1;
    const draw = () => {
        g.clearRect(0, 0, canvas.width, canvas.height);
        // チャプターの帯と番号・メモを描く
        sheet.chapters.forEach((chapter, ci) => {
            g.fillStyle = ci % 2 ? "#15171b" : "#111316";
            g.fillRect(fx(ci * length), 0, fx(length) - left, canvas.height);
            g.fillStyle = "#8b919c"; g.font = "600 11px sans-serif"; g.textAlign = "left"; g.textBaseline = "middle";
            const label = `${ci + 1}` + (chapter.comment ? ` ${chapter.comment}` : "");
            g.save(); g.beginPath(); g.rect(fx(ci * length) + 4, 0, fx(length) - left - 8, top); g.clip();
            g.fillText(label, fx(ci * length) + 6, top / 2); g.restore();
        });
        // 混み具合（60Fごとの出現数）を棒グラフで描く
        const graphBottom = top + graphH;
        counts.forEach((c, i) => {
            const h = c / peak * (graphH - 8);
            g.fillStyle = c === peak ? "#f0883e" : "#5b8cff";
            g.fillRect(fx(i * bucket) + 0.5, graphBottom - h, Math.max(1, fx(bucket) - left - 1), h);
        });
        g.fillStyle = "#8b919c"; g.textAlign = "right"; g.font = "11px sans-serif";
        g.fillText("混み具合", left - 10, top + graphH / 2);
        // 敵の種類ごとの行に出現の印を描く
        keys.forEach((key, k) => {
            const y = graphBottom + 10 + k * laneH;
            g.fillStyle = "#c9ccd2"; g.textAlign = "right";
            g.fillText(key.length > 14 ? key.slice(0, 13) + "…" : key, left - 10, y + laneH / 2);
            g.fillStyle = "#1f2228"; g.fillRect(left, y + laneH - 1, width, 1);
            g.fillStyle = colorOf(key);
            for (const s of spawns) if (s.key === key) g.fillRect(fx(s.frame) - 1, y + 4, 3, laneH - 8);
        });
        // 時間の目盛りを描く
        g.fillStyle = "#6b717c"; g.textAlign = "center";
        for (let f = 0; f <= total; f += 500) g.fillText(`${f}F`, fx(f), canvas.height - 9);
        // 再生位置を描く
        g.fillStyle = "#f0883e"; g.fillRect(fx(preview.frame) - 1, top, 2, canvas.height - top - 20);
        // マウス位置のフレームとチャプターを表示する
        if (hover >= 0) {
            const ci = Math.min(sheet.chapters.length - 1, Math.floor(hover / length));
            g.fillStyle = "rgba(255, 255, 255, 0.5)"; g.fillRect(fx(hover), top, 1, canvas.height - top - 20);
            g.fillStyle = "#e4e6eb"; g.textAlign = fx(hover) > left + width - 160 ? "right" : "left";
            g.fillText(`${hover}F（チャプター${ci + 1}の${hover - ci * length}F）クリックでここから再生`, fx(hover) + (g.textAlign === "left" ? 6 : -6), top + 8);
        }
    };
    const frameAt = (e) => {
        const r = canvas.getBoundingClientRect();
        const px = (e.clientX - r.left) * canvas.width / r.width;
        return px < left || px > left + width ? -1 : Math.round((px - left) / width * total);
    };
    canvas.onpointermove = (e) => { hover = frameAt(e); canvas.style.cursor = hover >= 0 ? "pointer" : "default"; draw(); };
    canvas.onpointerleave = () => { hover = -1; draw(); };
    canvas.onclick = (e) => {
        const f = frameAt(e);
        if (f < 0) return;
        preview.frame = f;
        preview.draw();
    };

    // 再生画面を作り、タイムラインと一緒に描き直す
    const player = StagePlayer(sheet, spawns, total);
    preview.speed = preview.speed || 1;
    preview.frame = Math.min(preview.frame, total);
    preview.draw = () => {
        if (preview.frame >= total) { preview.frame = total; preview.playing = false; }
        player.draw();
        draw();
    };
    preview.draw();
    root.append(player.element);
    root.append(El("section", { className: "card" },
        El("div", { className: "card-head" }, El("h2", {}, "タイムライン"),
            El("span", { className: "help", style: "margin: 0" }, "上の棒 = 60Fごとの出現数（橙が最大）、下の行 = 敵の種類ごとの出現、橙の縦線 = 再生位置。クリックでその時点へ移動")),
        El("div", { className: "card-body" }, canvas)));

    // チャプターごと・種類ごとの出現数の表を作る
    const table = El("table", {}, El("tr", {}, El("th", {}, "チャプター"), El("th", {}, "メモ"),
        ...keys.map((key) => El("th", {}, El("span", { className: "dot", style: `background: ${colorOf(key)}` }), key)), El("th", {}, "合計")));
    sheet.chapters.forEach((chapter, ci) => {
        const inChapter = spawns.filter((s) => s.chapter === ci);
        table.append(El("tr", { className: "link", title: "クリックで編集", onclick: () => JumpToChapter(ci) },
            El("td", {}, String(ci + 1)), El("td", { style: "color: var(--muted)" }, chapter.comment || ""),
            ...keys.map((key) => El("td", {}, String(inChapter.filter((s) => s.key === key).length || ""))),
            El("td", {}, El("b", {}, String(inChapter.length)))));
    });
    root.append(El("section", { className: "card" }, El("div", { className: "card-head" }, El("h2", {}, "チャプター別の出現数")),
        El("div", { className: "card-body" }, table,
            El("div", { className: "help" }, "行をクリックでそのチャプターを編集する。画面内の敵数の上限などで、ゲームでは出現が間引かれることがある"))));
}

/**
 * @brief 行動スクリプトの2D動作をcanvasへ描画し、再生用の描画関数を登録する
 * @param script 表示する行動スクリプト
 * @return プレビュー要素
 */
function Preview(script) {
    const width = (View.maxX - View.minX) * View.scale, height = (View.maxY - View.minY) * View.scale;
    const canvas = El("canvas", { width, height });
    const g = canvas.getContext("2d");
    const sx = (x) => (x - View.minX) * View.scale, sy = (y) => (View.maxY - y) * View.scale;
    const fx = (px) => px / View.scale + View.minX, fy = (py) => View.maxY - py / View.scale;
    const slider = El("input", { type: "range", min: 0, value: preview.frame, style: "width: 360px",
        oninput: (e) => { preview.frame = Number(e.target.value); preview.playing = false; preview.draw(); } });
    const label = El("span");
    let result = null;
    let last = 0;

    // スクリプトを実行し直す（ドラッグ中も呼ぶ）
    const simulate = () => {
        try {
            result = preview.mode === "3d" ? SimulateScript3D(script, 0, preview.startY, 0, preview.playerY) :
                SimulateScript(script, 2.8, preview.startY, preview.playerX, preview.playerY, 3600);
        } catch (e) {
            result = { path: [], shots: [] };
        }
        last = Math.max(0, result.path.length - 1);
        slider.max = last;
    };

    preview.draw = () => {
        simulate();
        // 最後のフレームで再生を止める
        if (preview.frame > last) { preview.frame = last; preview.playing = false; }
        const t = preview.frame;
        if (preview.mode === "3d") {
            // 3Dは自機の後ろから軌跡・敵・弾を描く
            const shots = [];
            for (const s of result.shots) {
                if (s.frame > t) continue;
                const dt = t - s.frame, z = s.z + s.vz * dt;
                if (z >= 0 && z <= 70) shots.push({ x: s.x + s.vx * dt, y: s.y + s.vy * dt, z, color: s.pc === selectedCommand ? "#fff" : "#fd6" });
            }
            Draw3D(g, width, height, {
                trail: result.path.map((p) => ({ ...p, hl: p.pc === selectedCommand })),
                enemies: [{ ...(result.path[t] || { x: 0, y: preview.startY, z: 60 }), color: "#f96" }],
                shots, playerX: 0, playerY: preview.playerY
            });
            slider.value = t;
            label.textContent = ` ${t} / ${last}F　表示中の弾 ${shots.length}発（全${result.shots.length}発）` +
                (result.path.length && result.path[last].z < 2 ? `　${last}Fで自機の後ろへ抜ける` : "");
            return;
        }
        g.clearRect(0, 0, width, height);
        // 自機の移動範囲と自機を描く
        g.strokeStyle = "#333";
        g.strokeRect(sx(-2.0), sy(1.53), 4.0 * View.scale, 3.15 * View.scale);
        g.fillStyle = "#6cf";
        g.beginPath(); g.moveTo(sx(preview.playerX) + 9, sy(preview.playerY));
        g.lineTo(sx(preview.playerX) - 7, sy(preview.playerY) - 6); g.lineTo(sx(preview.playerX) - 7, sy(preview.playerY) + 6); g.fill();
        // 敵の軌跡を描き、選択中のコマンドの区間を強調する
        result.path.forEach((p, i) => {
            if (i === 0) return;
            const q = result.path[i - 1];
            g.strokeStyle = p.pc === selectedCommand ? "#fc6" : "#555";
            g.lineWidth = p.pc === selectedCommand ? 3 : 1;
            g.beginPath(); g.moveTo(sx(q.x), sy(q.y)); g.lineTo(sx(p.x), sy(p.y)); g.stroke();
        });
        g.lineWidth = 1;
        // ドラッグできる点（出現位置と移動先）を描く
        g.font = "bold 10px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
        g.strokeStyle = "#f96";
        g.beginPath(); g.arc(sx(2.8), sy(preview.startY), 7, 0, Math.PI * 2); g.stroke();
        g.fillStyle = "#f96"; g.fillText("出", sx(2.8), sy(preview.startY));
        script.commands.forEach((c, ci) => {
            if (c.op !== "MoveTo") return;
            g.fillStyle = ci === selectedCommand ? "#fc6" : "#a8f";
            g.beginPath(); g.arc(sx(c.x), sy(c.y), 8, 0, Math.PI * 2); g.fill();
            g.fillStyle = "#000"; g.fillText(String(ci), sx(c.x), sy(c.y) + 0.5);
        });
        // 現在フレームの敵を描く
        const enemy = result.path[t] || { x: 2.8, y: preview.startY };
        g.fillStyle = "#f96";
        g.beginPath(); g.arc(sx(enemy.x), sy(enemy.y), 6, 0, Math.PI * 2); g.fill();
        // 発射済みの弾を等速直線で進めて描く
        // ponytail: 弾は等速直線のみ。ゲーム側の画面外消去や自機との衝突は再現しない
        let visible = 0;
        for (const s of result.shots) {
            if (s.frame > t) continue;
            const x = s.x + s.vx * (t - s.frame), y = s.y + s.vy * (t - s.frame);
            if (x < View.minX || x > View.maxX || y < View.minY || y > View.maxY) continue;
            g.fillStyle = s.pc === selectedCommand ? "#fff" : "#fd6";
            g.fillRect(sx(x) - 2, sy(y) - 2, 4, 4);
            ++visible;
        }
        slider.value = t;
        label.textContent = ` ${t} / ${last}F　表示中の弾 ${visible}発（全${result.shots.length}発）` +
            (result.path.length && result.path[last].x < -2.6 ? `　${last}Fで画面外へ消える` : "");
    };

    // 出現位置・自機・移動先の点をドラッグで動かす
    MakeDraggable(canvas, () => preview.mode === "3d" ? [] : [
        { x: sx(2.8), y: sy(preview.startY), move: (px, py) => { preview.startY = Round(fy(py)); } },
        { x: sx(preview.playerX), y: sy(preview.playerY), move: (px, py) => { preview.playerX = Round(fx(px)); preview.playerY = Round(fy(py)); } },
        ...script.commands.flatMap((c, ci) => c.op !== "MoveTo" ? [] : [{
            x: sx(c.x), y: sy(c.y),
            move: (px, py) => { c.x = Round(fx(px)); c.y = Round(fy(py)); selectedCommand = ci; },
            select: () => { selectedCommand = ci; Render(); }
        }])
    ], () => preview.draw());
    preview.draw();

    return El("section", { className: "card" }, El("div", { className: "card-head" }, El("h2", {}, "プレビュー"), ModeSwitch()),
        El("div", { className: "card-body" }, El("div", { className: "help" }, preview.mode === "3d" ?
            "3Dは2Dの横の動きを奥行きに読み替えたもの（ゲームと同じ計算）。左右位置は出現規則の「3Dの左右X」で、ここでは中央。点のドラッグは2D表示で行う" :
            "「出」= 出現位置（上下にドラッグ）、▶ = 自機（ドラッグで移動、狙う弾の向きが変わる）、紫の番号 = 移動先（ドラッグで変更）。黄色 = 選択中のコマンドの区間"),
        El("div", {}, El("button", { onclick: () => { if (preview.frame >= last) preview.frame = 0; preview.playing = !preview.playing; } }, "▶ 再生 / ■ 停止"),
            " ", slider, label),
        canvas));
}

/**
 * @brief 行動スクリプトの編集画面を描画する
 * @param root 描画先の要素
 * @param side サイドバーの描画先
 * @return なし
 */
function RenderScripts(root, side) {
    const scripts = scriptsEntry.data.scripts;
    scriptIndex = Math.max(0, Math.min(scriptIndex, scripts.length - 1));
    const script = scripts[scriptIndex];
    if (selectedCommand >= script.commands.length) selectedCommand = -1;

    // サイドバーにスクリプトの一覧と追加・削除を置く
    const add = (copy) => {
        scripts.push(copy ? JSON.parse(JSON.stringify({ ...script, name: script.name + "Copy" })) :
            { name: "NewMove" + scripts.length, hp: 10, score: 100, commands: [
                { op: "MoveTo", frames: 90, x: 1.3, y: 0 }, { op: "FireAimed", speed: 0.02 }, { op: "Move", frames: 0, vx: -0.015, vy: 0 }] });
        scriptIndex = scripts.length - 1;
        selectedCommand = -1;
        Changed();
    };
    side.append(El("div", { className: "side-title" }, "動きの一覧"),
        El("div", { className: "side-list" },
            ...scripts.map((s, i) => El("button", { className: i === scriptIndex ? "on" : "",
                onclick: () => { scriptIndex = i; selectedCommand = -1; preview.frame = 0; Render(); } }, s.name)),
            El("button", { className: "ghost", onclick: () => add(false) }, "＋ 新しい動き")),
        El("div", { className: "help", style: "padding: 0 8px" }, "名前はステージの「★ 自作の動き」で選ぶ時に使う"));

    // 本文に名前・コマンド・プレビューを置く
    const body = El("div", { className: "card-body" });
    root.append(El("section", { className: "card" }, El("div", { className: "card-head" }, El("h2", {}, script.name),
        El("span", { className: "spacer", style: "flex: 1" }),
        El("button", { className: "ghost", onclick: () => add(true) }, "複製"),
        El("button", { className: "ghost danger", onclick: () => {
            if (scripts.length > 1 && confirm(`${script.name}を削除する?`)) { scripts.splice(scriptIndex, 1); selectedCommand = -1; Changed(); }
        } }, "削除")), body));
    body.append(El("div", { className: "toolbar" }, "名前",
        El("input", { value: script.name, title: "英数字と_のみ", onchange: (e) => {
            // この動きを使っているステージの敵も新しい名前へ付け替える
            for (const s of sheets) {
                for (const c of s.data.chapters) for (const r of c.rules) if (r.script === script.name) r.script = e.target.value;
            }
            script.name = e.target.value;
            Changed();
        } }),
        "耐久力", NumberInput(script, "hp", 1, "倒すのに必要なダメージ"), "スコア", NumberInput(script, "score", 1, "倒した時の得点")));
    body.append(Caption("やること（上から順に実行）", "行をクリックするとプレビューでその区間が黄色になる。移動しないコマンドの間も直前の速度で進み続ける"));
    const table = El("table");
    script.commands.forEach((command, ci) => {
        const spec = CommandSpecs[command.op] || { frames: false, args: [] };
        const info = Commands[command.op] || { label: command.op, describe: () => "" };
        const keys = [...(spec.frames ? ["frames"] : []), ...spec.args.filter((a) => typeof a === "string")];
        const opSelect = El("select", { onchange: (e) => {
            script.commands[ci] = { op: e.target.value, ...Commands[e.target.value].defaults };
            Changed();
        } }, ...Object.keys(Commands).map((op) => El("option", { value: op, selected: op === command.op }, Commands[op].label)));
        const move = (d) => {
            const j = ci + d;
            if (j < 0 || j >= script.commands.length) return;
            [script.commands[ci], script.commands[j]] = [script.commands[j], script.commands[ci]];
            selectedCommand = j;
            Changed();
        };
        let text = "";
        try { text = info.describe(command); } catch (e) { text = ""; }
        table.append(El("tr", { className: ci === selectedCommand ? "selected" : "", onclick: (e) => {
            if (ci === selectedCommand || e.target.tagName !== "TD") return;
            selectedCommand = ci;
            Render();
        } },
            El("td", {}, `#${ci}`), El("td", {}, opSelect),
            El("td", {}, ...keys.flatMap((key) => [` ${key === "count" && command.op === "Repeat" ? "回数(0=無限)" : ArgLabels[key]} `,
                NumberInput(command, key, IntegerArgs.includes(key) ? 1 : "any")]),
                El("div", { className: "desc" }, text)),
            El("td", { className: "actions" },
                El("button", { className: "ghost", title: "上へ", onclick: () => move(-1) }, "↑"),
                El("button", { className: "ghost", title: "下へ", onclick: () => move(1) }, "↓"),
                El("button", { className: "ghost", onclick: () => { script.commands.splice(ci + 1, 0, { ...command }); Changed(); } }, "複製"),
                El("button", { className: "ghost danger", onclick: () => { script.commands.splice(ci, 1); selectedCommand = -1; Changed(); } }, "削除"))));
    });
    body.append(table);

    // コマンドの追加ボタンを並べる（選択中の行の後ろ、なければ末尾へ追加）
    body.append(El("div", { className: "palette" }, "追加: ", ...Object.keys(Commands).map((op) => El("button", { onclick: () => {
        const at = selectedCommand >= 0 ? selectedCommand + 1 : script.commands.length;
        const command = { op, ...Commands[op].defaults };
        if (op === "Repeat") command.target = Math.max(0, at - 1);
        script.commands.splice(at, 0, command);
        selectedCommand = at;
        Changed();
    } }, "＋ " + Commands[op].label))));
    body.append(El("div", { className: "help" }, "座標の目安: 横は右端2.8〜左端-2.6、縦は上1.5〜下-1.6。速度は1フレームの移動量で、横速度-0.01なら約9秒で画面を横切る。角度は0°が右、90°が上"));
    root.append(Preview(script));
}

/**
 * @brief 現在の画面を描画し、検証結果を表示する
 * @return なし
 */
function Render() {
    const root = $("editor"), side = $("sideDynamic");
    root.replaceChildren();
    side.replaceChildren();
    preview.draw = null;
    if (!scriptsEntry) return;
    $("tabSheets").className = tab === "sheets" ? "on" : "";
    $("tabOverview").className = tab === "overview" ? "on" : "";
    $("tabScripts").className = tab === "scripts" ? "on" : "";
    const sheetTitle = current ? `ステージ${current.data.stage}　${current.data.difficulty}` : "";
    $("title").textContent = tab === "scripts" ? "敵の行動" : `${tab === "overview" ? "ステージ全体" : "敵の出現"}　${sheetTitle}`;
    if (tab === "scripts") {
        RenderScripts(root, side);
    } else {
        side.append(StagePicker());
        if (tab === "overview") RenderOverview(root); else RenderSheet(root);
    }

    // 全体を検証し、未保存の項目を表示する
    const dirty = [scriptsEntry, ...sheets].filter(IsDirty);
    $("save").disabled = dirty.length === 0;
    $("save").className = dirty.length ? "primary" : "";
    try {
        GenerateScripts(scriptsEntry.data);
        for (const s of sheets) GenerateSheet(s.data, ScriptNames());
        SetStatus(dirty.length ? `未保存: ${dirty.map((e) => e === scriptsEntry ? "敵の行動" : `ステージ${e.data.stage} ${e.data.difficulty}`).join("、")}` : "すべて保存済み",
            dirty.length ? "dirty" : "ok");
    } catch (e) {
        SetStatus("直す必要あり: " + e.message, "error");
    }
}

/**
 * @brief タブを切り替える
 * @param name "sheets"、"overview"、"scripts" のいずれか
 * @return なし
 */
function SwitchTab(name) {
    tab = name;
    // 再生位置と速さは画面ごとに最初から始める
    preview.playing = false;
    preview.frame = 0;
    preview.speed = 1;
    Render();
}

// 再生中はプレビューのフレームを進めて描き直す
(function Animate() {
    if (preview.playing && preview.draw) {
        preview.frame += preview.speed;
        preview.draw();
    }
    requestAnimationFrame(Animate);
})();

/**
 * @brief Stagesフォルダ内の行動スクリプトと敵出現シートのJSONを読み込む
 * @return なし
 */
async function OpenStages() {
    stagesDir = await window.showDirectoryPicker({ mode: "readwrite" });
    const loaded = [];
    // Common/EnemyScripts.json を読み込む
    const common = await stagesDir.getDirectoryHandle("Common").catch(() => null);
    if (!common) {
        SetStatus("Commonフォルダがない。Presentation/Gameplay/Stages を選んだか確認する", "error");
        return;
    }
    const scriptsData = JSON.parse(await (await (await common.getFileHandle("EnemyScripts.json")).getFile()).text());
    // StageN/StageNEnemySheetXxx.json を列挙する
    for await (const [dirName, dir] of stagesDir.entries()) {
        if (dir.kind !== "directory" || !/^Stage\d+$/.test(dirName)) continue;
        for await (const [name, file] of dir.entries()) {
            if (file.kind !== "file" || !/EnemySheet\w+\.json$/.test(name)) continue;
            const data = JSON.parse(await (await file.getFile()).text());
            loaded.push({ name: name.replace(/\.json$/, ""), dir, data, saved: JSON.stringify(data) });
        }
    }
    if (loaded.length === 0) {
        SetStatus("敵出現シートのJSONが見つからない。Presentation/Gameplay/Stages を選んだか確認する", "error");
        return;
    }
    scriptsEntry = { name: "EnemyScripts", dir: common, data: scriptsData, saved: JSON.stringify(scriptsData) };
    sheets = loaded.sort((a, b) => a.data.stage - b.data.stage ||
        Difficulties.indexOf(a.data.difficulty) - Difficulties.indexOf(b.data.difficulty));
    current = sheets[0];
    Render();
}

/**
 * @brief 変更のあるJSONと、それに対応するC++ヘッダをすべて書き出す
 * @return なし
 */
async function Save() {
    // 先にすべて生成して、1つでも不正なら何も書き込まない
    let scriptsHeader;
    const sheetHeaders = [];
    try {
        scriptsHeader = GenerateScripts(scriptsEntry.data);
        // スクリプト番号は出現シートの.hに埋め込まれるため、全シートの.hを作り直す
        for (const s of sheets) sheetHeaders.push([s, GenerateSheet(s.data, ScriptNames())]);
    } catch (e) {
        SetStatus("保存しなかった: " + e.message, "error");
        return;
    }
    // 内容が同じファイルは再ビルドを避けるため書かない
    const write = async (dir, name, text) => {
        const crlf = text.replace(/\r?\n/g, "\r\n");
        const handle = await dir.getFileHandle(name, { create: true });
        if (await (await handle.getFile()).text() === crlf) return;
        const w = await handle.createWritable();
        await w.write(crlf);
        await w.close();
    };
    for (const entry of [scriptsEntry, ...sheets]) {
        if (IsDirty(entry)) await write(entry.dir, entry.name + ".json", JSON.stringify(entry.data, null, 2) + "\n");
    }
    await write(scriptsEntry.dir, "EnemyScripts.h", scriptsHeader);
    for (const [s, text] of sheetHeaders) await write(s.dir, s.name + ".h", text);
    for (const entry of [scriptsEntry, ...sheets]) entry.saved = JSON.stringify(entry.data);
    Render();
}

$("open").onclick = () => OpenStages().catch((e) => SetStatus(e.message, "error"));
$("save").onclick = () => Save().catch((e) => SetStatus(e.message, "error"));
$("tabSheets").onclick = () => SwitchTab("sheets");
$("tabScripts").onclick = () => SwitchTab("scripts");
$("tabOverview").onclick = () => SwitchTab("overview");
window.onbeforeunload = () => (scriptsEntry && [scriptsEntry, ...sheets].some(IsDirty) ? true : undefined);
</script>
</body>
</html>
